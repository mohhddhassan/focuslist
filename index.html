<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusList</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>FocusList</h1>
      <p>One list, kept in order.</p>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="label">Total</div></div>
    <div class="stat"><div class="num" id="statCompleted">0</div><div class="label">Completed</div></div>
    <div class="stat"><div class="num" id="statPending">0</div><div class="label">Pending</div></div>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="newTaskInput" placeholder="Add a task…" maxlength="200" aria-label="New task title" autocomplete="off">
  <div class="custom-select" id="newTaskPriority">
    <button
      type="button"
      class="custom-select-trigger"
      aria-haspopup="listbox"
      aria-expanded="false"
      aria-label="Priority for new task"
    >
      <span class="custom-select-value">Medium</span>
      <span class="custom-select-arrow">⌄</span>
    </button>

    <ul class="custom-select-options" role="listbox">
      <li
        role="option"
        data-value="medium"
        aria-selected="true"
      >
        Medium
      </li>
      <li
        role="option"
        data-value="high"
        aria-selected="false"
      >
        High
      </li>
      <li
        role="option"
        data-value="low"
        aria-selected="false"
      >
        Low
      </li>
    </ul>

    <input type="hidden" value="medium">
  </div>
    <button type="submit" class="btn btn-primary" id="addBtn">Add task</button>
  </form>

  <div class="controls">
    <input type="search" id="searchInput" placeholder="Search tasks…" aria-label="Search tasks by title">
    <div class="filter-group" id="statusFilter" role="group" aria-label="Filter by status">
      <button type="button" data-value="all" class="active">All</button>
      <button type="button" data-value="active">Active</button>
      <button type="button" data-value="completed">Completed</button>
    </div>
  <div class="custom-select priority-filter" id="priorityFilter">
    <button
      type="button"
      class="custom-select-trigger"
      aria-haspopup="listbox"
      aria-expanded="false"
      aria-label="Filter by priority"
    >
      <span class="custom-select-value">Any priority</span>
      <span class="custom-select-arrow">⌄</span>
    </button>

    <ul class="custom-select-options" role="listbox">
      <li
        role="option"
        data-value="all"
        aria-selected="true"
      >
        Any priority
      </li>
      <li
        role="option"
        data-value="high"
        aria-selected="false"
      >
        High
      </li>
      <li
        role="option"
        data-value="medium"
        aria-selected="false"
      >
        Medium
      </li>
      <li
        role="option"
        data-value="low"
        aria-selected="false"
      >
        Low
      </li>
    </ul>

    <input type="hidden" value="all">
  </div>
  </div>

  <div class="list-section">
    <ul class="tasks" id="taskList"></ul>
    <div class="empty" id="emptyState" hidden>
      <div class="glyph">-</div>
      <p id="emptyMessage">No tasks yet. Add your first one above.</p>
    </div>
  </div>

  <footer class="hint">Tasks are saved to this browser only.</footer>
</div>

<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
